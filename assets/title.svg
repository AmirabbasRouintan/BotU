<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 50" width="260" height="50">
  <defs>
    <style>
      @keyframes typing { from { width: 0; } to { width: 220px; } }
      @keyframes blink { 50% { opacity: 0; } }
      .typewriter {
        overflow: hidden;
        white-space: nowrap;
        width: 0;
        animation: typing 2s steps(11, end) forwards;
      }
      .cursor {
        animation: blink 0.75s step-end infinite;
      }
    </style>
  </defs>
  <g class="typewriter">
    <text x="0" y="35" font-family="monospace" font-size="30" font-weight="bold" fill="#d3869b">BotU</text>
  </g>
  <text class="cursor" x="125" y="35" font-family="monospace" font-size="30" fill="#d3869b">|</text>
</svg>
